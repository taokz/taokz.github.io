# Full publication list. Rendered on /publications (grouped by year, in the order
# listed here) and referenced by id from data/research.yaml on the home page.
#
# Fields
#   id        unique slug, used by data/research.yaml
#   year      integer
#   title     paper title
#   authors   full comma-separated list. "Kai Zhang" is bolded automatically
#             (params.selfName). Lists longer than 6 are shortened when shown:
#             first 3, …, Kai Zhang, …, last 2. Leave empty to hide the line.
#   venue     full venue name (used as a tooltip)
#   label     short venue shown in the left column (e.g. "KDD", "npj Digit. Med.")
#   note      optional tag after the title (e.g. "Oral")
#   links     list of {name, url}; rendered as "paper  code  …"

