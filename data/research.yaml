# "Selected Research" on the home page, organised along the lifecycle of a
# medical foundation model: pretrain → post-train → evaluate → deploy → secure.
# Each stage: a one-sentence description of published work and 1–3 paper ids
# from data/publications.yaml.

themes:
  - title: "Pretraining"
    description: "Vision–language models pretrained and fine-tuned on biomedical data, so one model can handle images and text across many tasks."
    papers: [biomedgpt, biomed-vlm-scaling]

  - title: "Post-training"
    description: "Reward models and reinforcement learning that make medical model outputs, such as chest X-ray reports, more clinically accurate."
    papers: [medjudge, editgrpo]

  - title: "Evaluation"
    description: "Testing GPT-5 and GPT-4V on multimodal medical diagnosis to measure where general-purpose models hold up and where they fail."
    papers: [gpt5-medical-agent, gpt4v-comparative]

  - title: "Deployment: agentic systems"
    description: "Agent systems for radiology image interpretation that follow radiologist-like workflows and show their reasoning, localized on the image."
    papers: [radagents, radfabric]

  - title: "Security and safety"
    description: "Federated learning methods that let institutions train shared models without exposing raw data or embeddings to each other."
    papers: [secure-embedding-aggregation, fedr]
