# "Selected Publications" on the home page: three themes, each with a
# one-sentence description and paper ids from data/publications.yaml, in order.

themes:
  - title: "Generalist biomedical models"
    description: "One vision-language model across many imaging modalities and tasks."
    papers: [biomedgpt, medgpt-oss, biomed-vlm-scaling]

  - title: "Agents and post-training for radiology"
    description: "Agents that read chest X-rays step by step the way radiologists do, and training that rewards clinically correct reports."
    papers: [radagents, editgrpo, medjudge]

  - title: "Evaluating medical agents"
    description: "Where general-purpose models hold up in real diagnosis, and where they break."
    papers: [gpt5-medical-agent, gpt4v-comparative]
