# "Selected Research" on the home page: 2–3 themes, each with a one-sentence
# description and 1–3 paper ids from data/publications.yaml.
# The descriptions below are drafts — rewrite them in your own words.

themes:
  - title: "Agentic AI for radiology"
    description: "Multi-agent systems that reason over images, reports, and clinical context the way radiologists do — with intermediate steps a clinician can inspect."
    papers: [radagents, radfabric]

  - title: "Evaluating generalist models in medicine"
    description: "Careful, task-grounded evaluation of frontier models on real multimodal diagnosis, to find where general capability does and does not translate to clinical reliability."
    papers: [gpt5-medical-agent]

  - title: "Biomedical foundation models"
    description: "A single vision–language model trained across modalities and tasks, released openly so it can be adapted rather than rebuilt."
    papers: [biomedgpt]
