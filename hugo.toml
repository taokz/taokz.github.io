baseURL = "https://taokz.github.io/"
locale = "en-US"
title = "Kai Zhang"
# PaperMod supplies RSS, robots.txt, the 404 page and shortcodes. The page
# layout, styles and head are this site's own (layouts/, assets/css/site.css).
theme = "PaperMod"
enableRobotsTXT = true
# No tags/categories: the site is a homepage, a blog and a publication list.
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 50

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[menus]
  [[menus.main]]
    name = "About"
    pageRef = "/"
    weight = 10
  # The /publications/ page is switched off for now (content/publications.md,
  # build.render = never), so this goes to Selected Publications on the home page.
  [[menus.main]]
    name = "Publications"
    url = "/#research"
    weight = 20
  [[menus.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 30
  # CV is hidden until there is a file. To restore: add static/cv.pdf, then
  # [[menus.main]]
  #   name = "CV"
  #   url = "/cv.pdf"
  #   weight = 40

[params]
  description = "Kai Zhang — Postdoctoral Scholar, Department of Radiation Oncology, Stanford University."
  author = "Kai Zhang"
  ShowFullTextinRSS = true

  # Bolded in every author list (data/publications.yaml).
  selfName = "Kai Zhang"

  # "All publications →" on the home page. Change to "/publications/" when
  # that page is switched back on.
  allPublicationsURL = "https://scholar.google.com/citations?user=XL1iKSEAAAAJ"

  # Footer
  location = "Stanford, California"

  # Sidebar ---------------------------------------------------------------
  [params.profile]
    name = "Kai Zhang"
    nativeName = "章愷"
    monogram = "KZ"
    role = "Postdoctoral Scholar"
    affiliation = ["Department of Radiation Oncology", "Stanford University"]

    # Contact rows: label on the left, value on the right. Rows without a
    # url are shown as plain text (the email address).
    [[params.profile.contacts]]
      label = "Email"
      text = "zkai@stanford.edu"
    [[params.profile.contacts]]
      label = "Scholar"
      text = "Google Scholar"
      url = "https://scholar.google.com/citations?user=XL1iKSEAAAAJ"
    [[params.profile.contacts]]
      label = "GitHub"
      text = "taokz"
      url = "https://github.com/taokz"
    [[params.profile.contacts]]
      label = "X"
      text = "@kai_z99"
      url = "https://x.com/kai_z99"

[markup]
  [markup.highlight]
    noClasses = false        # colours come from assets/css/site.css
    lineNos = false
    codeFences = true
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      footnote = true
      [markup.goldmark.extensions.typographer]
        disable = false
      # Math is passed through untouched and rendered to HTML at build time
      # with KaTeX (see layouts/_markup/render-passthrough.html).
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]

[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"
