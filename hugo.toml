baseURL = "https://taokz.github.io/"
locale = "en-US"
title = "Kai Zhang"
theme = "PaperMod"
copyright = "© Kai Zhang"
enableRobotsTXT = true
# No tags/categories: the site is a homepage, a writing list, and a publication list.
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 50

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[menus]
  [[menus.main]]
    name = "Writing"
    pageRef = "/writing"
    weight = 10
  [[menus.main]]
    name = "Publications"
    pageRef = "/publications"
    weight = 20
  # CV hidden until static/cv.pdf is added; uncomment to restore.
  # [[menus.main]]
  #   name = "CV"
  #   url = "/cv.pdf"
  #   weight = 30

[params]
  env = "production"
  description = "Kai Zhang — Postdoctoral Scholar, Department of Radiation Oncology, Stanford University."
  author = "Kai Zhang"
  defaultTheme = "auto"        # follow the operating system
  disableThemeToggle = true
  disableScrollToTop = true
  DateFormat = "January 2, 2006"

  # Post pages
  ShowToc = true
  TocOpen = false
  UseHugoToc = true
  ShowReadingTime = false
  ShowWordCount = false
  ShowBreadCrumbs = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowCodeCopyButtons = true
  ShowFullTextinRSS = true
  hideAuthor = true

  # Used to bold your name in author lists (data/publications.yaml).
  selfName = "Kai Zhang"

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  [params.label]
    text = "Kai Zhang"

  # Home page header ----------------------------------------------------------
  [params.profile]
    name = "Kai Zhang"
    nativeName = "章愷"
    # photo = "/images/profile.jpg"   # optional: put the file in static/images/; shown at the top right of the home page
    title = "Postdoctoral Scholar, Department of Radiation Oncology, Stanford University"

    # Plain-text links under the research statement, in this order.
    [[params.profile.links]]
      name = "Email"
      url = "mailto:zkai@stanford.edu"
    [[params.profile.links]]
      name = "Scholar"
      url = "https://scholar.google.com/citations?user=XL1iKSEAAAAJ"
    [[params.profile.links]]
      name = "GitHub"
      url = "https://github.com/taokz"
    [[params.profile.links]]
      name = "X"
      url = "https://x.com/kai_z99"
    # CV hidden until static/cv.pdf is added; uncomment to restore.
    # [[params.profile.links]]
    #   name = "CV"
    #   url = "/cv.pdf"

[markup]
  [markup.highlight]
    noClasses = false        # use the CSS in assets/css/includes/chroma-styles.css
    lineNos = false
    codeFences = true
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      footnote = true
      [markup.goldmark.extensions.typographer]
        disable = false
      # Math is passed through untouched and rendered to HTML at build time
      # with KaTeX (see layouts/_markup/render-passthrough.html).
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]

[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"
