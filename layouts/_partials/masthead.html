<header class="mast">
  <div class="wrap">
    <a class="brand" href="{{ "" | relURL }}">{{ site.Params.profile.name }}</a>
    <nav class="nav" aria-label="Main">
      {{- $cur := . }}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>
