{{- /* One row in a post list. Context: a page. */ -}}
<li class="post-row">
  <time class="post-row-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
  <div class="post-row-body">
    <a class="post-row-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{- with .Description }}<span class="post-row-subtitle">{{ . }}</span>{{ end }}
  </div>
</li>
