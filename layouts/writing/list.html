{{- define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<p class="page-subtitle">{{ . }}</p>{{ end }}
</header>
{{- $posts := .RegularPages.ByDate.Reverse }}
{{- if $posts }}
<ul class="post-list">
  {{- range $posts }}{{ partial "post_row.html" . }}{{ end }}
</ul>
{{- else }}
<p class="empty">Nothing here yet.</p>
{{- end }}
{{- end }}
